# Render blueprint for the MusicPhone Elysia/Bun backend.
# The Next.js frontend is deployed separately on Vercel (root dir: apps/web).
services:
  - type: web
    name: musicphone-server
    # Docker, not node: Render's Node runtime does not ship the Bun binary that
    # `bun install` and `bun run` need. The Dockerfile pins the same Bun version
    # as .bun-version.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WEB_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://musicphone.vercel.app
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: musicphone-store
          property: connectionString
      # PORT is injected automatically by Render.

  # Rooms live here, so a deploy or an idle spin-down no longer ends every game.
  # (On older Render accounts this service type is still called `redis`; rename
  # both this block and the fromService reference above if the blueprint is
  # rejected.)
  - type: keyvalue
    name: musicphone-store
    plan: free
    ipAllowList: [] # reachable only from inside the Render network
    # Rooms expire on their own TTL; evicting them early would drop live games.
    maxmemoryPolicy: noeviction
